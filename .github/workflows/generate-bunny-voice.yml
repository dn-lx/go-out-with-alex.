name: Generate cartoon bunny voice (Kokoro)
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/generate-bunny-voice.yml"

permissions:
  contents: write

concurrency:
  group: bunny-recording-develop
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Install CPU voice model
        run: |
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'kokoro>=0.9.4,<1' 'soundfile>=0.12' 'numpy<3'
      - name: Validate Python source
        run: python -m py_compile scripts/tts/generate.py
      - name: Render the 16 British-English recordings
        run: python scripts/tts/generate.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          BUNNY_VOICE: bf_emma
          BUNNY_SPEED: '1.04'
      - name: Publish recordings only to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/*.mp3 public/audio/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "feat: publish generated bunny narration to develop [skip ci]"
            git push origin HEAD:develop
          fi
      - name: Upload audio as recovery artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bunny-voice-bf-emma
          path: public/audio/*.mp3
          if-no-files-found: error
          retention-days: 7
