name: Generate natural bunny voice (Qwen3)
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/generate-qwen-bunny.yml"

permissions:
  contents: write

concurrency:
  group: qwen-bunny-recordings-develop
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install CPU-only Qwen3-TTS
        run: |
          python -m pip install -U pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'qwen-tts' 'soundfile>=0.12' 'numpy<3'
      - name: Validate generator
        run: python -m py_compile scripts/tts/generate_qwen.py
      - name: Render all 16 natural voice lines
        run: python -u scripts/tts/generate_qwen.py
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_ENABLE_HF_TRANSFER: '0'
          OMP_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
      - name: Publish to develop only after all pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/*.mp3 public/audio/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "feat: replace Kokoro with natural Qwen3 bunny narration [skip ci]"
            git push origin HEAD:develop
          fi
      - name: Store recovery copy of the rendered audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-natural-bunny-voice
          path: public/audio/*.mp3
          if-no-files-found: error
          retention-days: 7
