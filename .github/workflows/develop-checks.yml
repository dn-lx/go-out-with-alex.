name: Develop checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify invitation and UI contracts
        run: npm test
      - name: Install headless browser test runtime
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Verify rendered emoji choices on phone and desktop
        run: node scripts/browser-smoke.cjs
