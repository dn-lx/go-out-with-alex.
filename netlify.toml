[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Development deploy settings. To publish develop--go-out-with-alex.netlify.app,
# enable the develop branch in Netlify > Continuous deployment > Branch deploys.
[context.develop]
  publish = "public"
  [context.develop.environment]
    DEPLOY_CHANNEL = "develop"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
