<body data-locked="true">
  <div class="decor" aria-hidden="true"><span class="d one">♡</span><span class="d two">✧</span><span class="d three">✦</span><span class="d four">♡</span></div>

      <div class="gate-copy">

      </div>
      <div class="gate-actions">
        <button class="btn btn-primary" id="request-fullscreen" type="button">⛶ Enter fullscreen</button>
        <p class="gate-help" id="fullscreen-help" role="status"></p>
        <button class="btn btn-secondary" id="manual-fullscreen" type="button" hidden style="margin-top:8px">I've expanded my screen →</button>
      </div>
    </section>
    <section class="gate-screen" id="password-gate" hidden>
      <div class="gate-art" aria-hidden="true">
        <div class="gate-film">
          <video class="gate-character" src="/video/idle.mp4" muted loop playsinline webkit-playsinline preload="none"></video>
          <canvas class="gate-canvas" aria-hidden="true"></canvas>
        </div>
      </div>
      <div class="gate-copy">
        <h1 id="password-heading">Secret bunny entrance</h1>
        <p class="gate-desc">Enter your invitation password to open the surprise.</p>
      </div>
      <div class="gate-actions">
        <form id="unlock-form" autocomplete="off">
          <label class="gate-label" for="invite-code">Your secret password</label>
          <input class="gate-code" id="invite-code" type="password" inputmode="text" spellcheck="false" autocapitalize="characters" autocomplete="off" placeholder="••••••••••" maxlength="32" required>
          <button class="btn btn-primary" id="unlock-button" type="submit">Open my surprise ♡</button>
        </form>
        <p class="gate-hint" id="gate-error" role="status"></p>

    </section>
  </div>

  <main class="layout" id="app-main">
    <header class="topline">
      <div class="brand"><span class="brand-icon" aria-hidden="true">♡</span> tiny bunny mission</div>
      <div class="voice-tools"><select id="voice-picker" class="voice-picker" aria-label="Choose bunny voice" title="Choose a voice from your device" hidden><option value="">Bunny picks</option></select><button id="voice-control" class="voice-control" type="button" aria-pressed="true">🔊 Bunny voice on</button></div>
    </header>
    <section class="shell" aria-label="Bunny's tiny invitation">
      <div class="art-pane">
        <div class="bunny-wrap" data-mood="smile" id="bunny" role="button" tabindex="0" aria-label="Play a funny bunny film" title="Tap to hear a silly bunny line">
          <video id="bunny-video" class="bunny-film" playsinline webkit-playsinline autoplay muted loop preload="metadata"
                 poster="/video/poster.png" aria-hidden="true"></video>
          <canvas id="bunny-canvas" class="bunny-canvas" aria-hidden="true"></canvas>
        </div>
        <div class="confetti hidden" id="confetti" aria-hidden="true"></div>
      </div>
      <div class="content-pane">
        <div class="copy enter" id="copy">
          <div class="status"><span class="chapter" id="chapter"></span><div class="dots" id="dots" aria-hidden="true"></div></div>
          <div aria-live="polite" aria-atomic="true">
            <h1 id="title">A little bunny has a question.</h1>
            <p class="description" id="description"></p>
          </div>
          <button id="voice-replay" class="voice-replay" type="button">▶ Hear the bunny</button>
          <details class="dialogue"><summary>Read bunny’s line</summary><p class="bubble" id="bubble"></p></details>
        </div>
        <div class="interaction">
          <div class="actions" id="actions"></div>
          <div class="navline"><button class="back hidden" id="back" type="button">← Go back</button><span class="feedback" id="feedback" role="status"></span></div>
        </div>
      </div>
    </section>
  </main>
  <!-- Netlify detects this at build time and stores only responses explicitly submitted by a visitor. -->
  <form name="going-out" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="form-name" value="going-out" type="hidden">
    <input name="bot-field" type="text">
    <input name="invite" type="text">
    <input name="recipient" type="text">
    <input name="outing" type="text">
    <input name="energy" type="text">
    <input name="timing" type="text">
    <input name="detail" type="text">
    <input name="meet_area" type="text">
    <input name="day" type="text">
    <input name="time" type="text">
    <input name="decision" type="text">
    <input name="extra_answers" type="text">
    <input name="subject" type="hidden" value="Alex received a bunny invitation answer">
  </form>
  <script>
    (() => {
      'use strict';
      const query = new URLSearchParams(window.location.search);
      const clean = (value, fallback) => (typeof value === 'string' && value.trim() ? value.trim().slice(0, 48).replace(/[<>]/g, '') : fallback);
      let person = 'you';
      let inviteId = '';
      let sender = 'Alex';
      const title = document.getElementById('title');
      const description = document.getElementById('description');
      const bubble = document.getElementById('bubble');
      const chapter = document.getElementById('chapter');
      const actions = document.getElementById('actions');
      const dots = document.getElementById('dots');
      const back = document.getElementById('back');
      const feedback = document.getElementById('feedback');
      const copy = document.getElementById('copy');
      const dialogue = copy.querySelector('.dialogue');
      const bunny = document.getElementById('bunny');
      const bunnyVideo = document.getElementById('bunny-video');
      const bunnyCanvas = document.getElementById('bunny-canvas');
      const gateVideos = Array.from(document.querySelectorAll('.gate-character'));
      const poster = new Image();
      poster.src = '/video/poster.png';

      function keyBunnyVideo(video, canvas) {
        const context = canvas.getContext('2d', { willReadFrequently: true });
        if (!context) return;
        const useVideoFrames = typeof video.requestVideoFrameCallback === 'function';
        let frameRequest = null;
        let hasVideoFrame = false;

        function draw(source, width, height) {
          if (canvas.width !== width) canvas.width = width;
          if (canvas.height !== height) canvas.height = height;
          context.clearRect(0, 0, width, height);
          context.drawImage(source, 0, 0);
          const frame = context.getImageData(0, 0, width, height);
          const pixels = frame.data;
          for (let i = 0; i < pixels.length; i += 4) {
            const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
            const blue = Math.max(0, Math.min(1,
              (r - 140) / 50, (g - 165) / 55, (b - 190) / 45,
              (b - r - 25) / 34, (g - r - 10) / 24, (250 - r) / 70));
            // Suppress reflected blue around bright fur and the floor shadow.
            // Keep the saturated blue eyes, where the red channel is darker.
            const spill = Math.max(0, Math.min(1, (r - 130) / 42, (b - g - 6) / 28, (b - r - 15) / 35));
            if (!blue && !spill) continue;
            const opacity = 1 - Math.min(1, blue * 1.55);
            pixels[i + 3] = Math.round(255 * opacity);
            pixels[i + 2] = Math.round(b - Math.max(blue, spill) * (b - g));
          }
          context.putImageData(frame, 0, 0);
        }

        function drawPoster() {
          if (!hasVideoFrame && poster.naturalWidth) draw(poster, poster.naturalWidth, poster.naturalHeight);
        }
        function drawVideo() {
          if (video.readyState < 2 || !video.videoWidth) return;
          draw(video, video.videoWidth, video.videoHeight);
          hasVideoFrame = true;
        }
        function queueFrame() {
          if (frameRequest !== null || video.paused || video.ended) return;
          frameRequest = useVideoFrames
            ? video.requestVideoFrameCallback(onFrame)
            : requestAnimationFrame(onFrame);
        }
        function onFrame() {
          frameRequest = null;
          drawVideo();
          queueFrame();
        }
        function stop() {
          if (frameRequest === null) return;
          if (useVideoFrames) video.cancelVideoFrameCallback(frameRequest);
          else cancelAnimationFrame(frameRequest);
          frameRequest = null;
        }
        if (poster.complete) drawPoster();
        else poster.addEventListener('load', drawPoster, { once: true });
        video.addEventListener('loadeddata', drawVideo);
        video.addEventListener('playing', queueFrame);
        video.addEventListener('pause', stop);
        video.addEventListener('ended', stop);
      }
      keyBunnyVideo(bunnyVideo, bunnyCanvas);
      gateVideos.forEach(video => keyBunnyVideo(video, video.nextElementSibling));
      function syncGateVideos(){
        gateVideos.forEach(video=>{
          const screen=video.closest('.gate-screen');
          if(!reduceMotion&&screen&&!screen.hidden&&document.body.contains(video))video.play().catch(()=>{});
          else video.pause();
        });
      }
      const confetti = document.getElementById('confetti');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      syncGateVideos();
      let step = 'intro';
      let tries = 0;
      let escapeTimer = null;
      let lastTouchDodge = 0;
      let voiceOn = true;
      let unlocked = false;
      const picks = { outing: '', activityKey: '', detail: '', meetArea: '', day: '', time: '' };
      const flows = ['ask','outing','detail','area','schedule','success'];
      const extraQuestions = [];
      const extraAnswers = {};
      const editedVoiceClips = new Set();
      let configuredAskTemplate = '{name}, would you like to go out with {sender}?';
      const fillQuestion = text => String(text).replaceAll('{name}', person).replaceAll('{sender}', sender);
      const activityQuestions = {
        coffee: { heading: 'What kind of coffee stop?', speech: 'Coffee? Excellent! I like mine with two carrots. I know, I know... weird.', options: [['🛋️','A cosy café and a good chat'], ['🚶','Takeaway coffee and a stroll'], ['🍵','Tea or a different drink'], ['✨','You two can choose']] },
        walk: { heading: 'Where should we wander?', speech: 'I am extremely good at walking. Except when there is a carrot shop nearby.', options: [['🌳','A park and some nature'], ['🏙️','Exploring the city'], ['🌊','Somewhere by the water'], ['✨','You two can choose']] },
        food: { heading: 'What food sounds good?', speech: 'Food? Now we are speaking my language. Does the menu have carrot cake?', options: [['🍝','Italian'], ['🍜','Asian food'], ['🌮','Street food or casual bites'], ['✨','You two can choose']] },
        sweet: { heading: 'Which sweet treat?', speech: 'Sweet treats! I have been training for this question my entire bunny life.', options: [['🥐','Bakery or pastries'], ['🍦','Ice cream or gelato'], ['🧇','Waffles or pancakes'], ['✨','You two can choose']] },
        surprise: { heading: 'What should the surprise feel like?', speech: 'A surprise! Ooh, I love a mystery. Especially when nobody hides my carrots.', options: [['🛋️','Calm and cosy'], ['🎳','Playful and fun'], ['🌿','Outside and exploring'], ['✨','Alex can come up with something']] }
      };
      const screens = {
        intro: {
          chapter: 'a tiny surprise',
          heading: `Hey, ${person}!`,
          subheading: 'A very small bunny has been sent on a very important mission. It takes about 20 seconds.',
          speech: 'Well, hello there! My name’s Bunny. I brought a letter, a bow tie, and absolutely zero qualifications for this job.',
          mood: 'smile'
        },
        ask: {
          chapter: 'the big question',
          heading: `${person}, would you like to go out with ${sender}?`,
          subheading: 'That’s the whole big, very important question. What do you think?',
          speech: 'Ehhh... Alex has a question for ya. He sent a rabbit. Bold choice, huh?',
          mood: 'wink'
        },
        outing: {
          chapter: 'step 1 of 4',
          heading: 'What would you enjoy doing?',
          subheading: 'Pick an idea that actually sounds fun to you.',
          speech: 'Here is the fun part. Coffee, wandering, food or sweets? I did not even put carrot farming on the list.',
          mood: 'smile',
          options: [
            ['☕','Coffee or tea','coffee'], ['🌿','A walk and exploring','walk'],
            ['🍝','A bite to eat','food'], ['🍰','Something sweet','sweet'],
            ['🎁','A little surprise','surprise']
          ]
        },
        detail: {
          chapter: 'step 2 of 4',
          heading: 'Just one tiny detail...',
          subheading: 'So Alex can plan something you would actually like.',
          speech: 'This is where I pretend to be a very professional rabbit assistant.',
          mood: 'wink'
        },
        area: {
          chapter: 'step 3 of 4',
          heading: 'Where would be convenient?',
          subheading: 'No need to pick a specific place yet.',
          speech: 'Somewhere comfortable for you, of course. My hop-mobile has a very limited range.',
          mood: 'smile',
          options: [
            ['📍','Somewhere near me'], ['🧭','Somewhere near Alex'],
            ['🤝','Meet halfway'], ['💬','Choose a place together']
          ]
        },
        schedule: {
          chapter: 'step 4 of 4',
          heading: 'Which day works for you?',
          subheading: 'Pick a day from the calendar and a time of day, or decide together later.',
          speech: 'Aha! The calendar! Pick a day that works for you. This rabbit does not do surprise alarms.',
          mood: 'wink'
        },
        success: {
          chapter: 'mission complete',
          heading: 'Bunny is doing happy little jumps!',
          subheading: `You said yes to going out with ${sender}. I think this deserves a tiny celebration.`,
          speech: 'Well, would ya look at that! Mission accomplished! I knew this bow tie had magical powers!',
          mood: 'happy'
        },
        decline: {
          chapter: 'still bunny approved',
          heading: 'Absolutely no worries.',
          subheading: 'Thank you for answering. You’re lovely, and this bunny wishes you a wonderful day.',
          speech: 'Hey, no worries! Thanks for being straight with me. Here’s a little flower, on the house.',
          mood: 'smile'
        }
      };
      function makeButton(label, cls, handler, id) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `btn ${cls}`;
        btn.textContent = label;
        if (id) btn.id = id;
        btn.addEventListener('click', handler);
        return btn;
      }
      function nav(next) {
        step = next;
        tries = 0;
        clearTimeout(escapeTimer);
        feedback.textContent = '';
        render();
        window.scrollTo(0, 0);
      }
      // Pre-recorded character clips take priority when published in /audio/manifest.json.
      // No clip exists until an MP3 is actually uploaded; browser speech remains the fallback.
      const voicePicker = document.getElementById('voice-picker');
      let availableVoices = [];
      let recordingClips = Object.create(null);
      let videoClips = Object.create(null);
      let activeVideo = false;
      function startIdleVideo() {
        if (reduceMotion || !unlocked || activeVideo || !videoClips.idle) return;
        if(bunnyVideo.getAttribute('src') !== videoClips.idle) {
          bunnyVideo.pause();
          bunnyVideo.src = videoClips.idle;
          bunnyVideo.load();
        }
        bunnyVideo.muted = true;
        bunnyVideo.loop = true;
        bunnyVideo.play().catch(() => {});
      }
      fetch('/video/manifest.json',{cache:'no-store'})
        .then(res=>res.ok?res.json():{})
        .then(data=>{
          if(!Number.isInteger(data?.version) || data.version<1 || !data.clips || typeof data.clips!=='object')return;
          for(const [name,path] of Object.entries(data.clips)){
            if(/^[a-z0-9_-]{1,32}$/.test(name)&&
               typeof path==='string'&&/^\/video\/[a-z0-9_-]+\.mp4$/.test(path)){
              videoClips[name]=path;
            }
          }
          videoClips.idle='/video/idle.mp4';
          startIdleVideo();
        })
        .catch(()=>{ /* Existing Qwen MP3s remain the backup for older browsers. */ });
      let currentRecording = null;
      let voiceSession = 0;
      let lipSyncTimer = null;
      let speechUtterance = null;
      fetch('/audio/manifest.json', {cache:'no-store'})
        .then(response => response.ok ? response.json() : {})
        .then(data => {
          if (!data || data.version !== 1 || !data.clips || typeof data.clips !== 'object') return;
          for (const [id,path] of Object.entries(data.clips)) {
            if (/^[a-z0-9_-]{1,32}$/.test(id) && typeof path === 'string' &&
                /^\/audio\/[a-z0-9_-]+\.mp3$/.test(path)) recordingClips[id] = path;
          }
          refreshVoices();
        })
        .catch(() => { /* Offline and missing manifests safely use device voices. */ });
      function voiceQuality(voice) {
        const name = voice.name.toLowerCase();
        let score = /^en-us/i.test(voice.lang) ? 42 : /^en-gb/i.test(voice.lang) ? 10 : 0;
        if (/natural|neural|premium|enhanced|studio/.test(name)) score += 80;
        if (/google|microsoft|siri|apple/.test(name)) score += 35;
        if (/guy|aaron|eddie|fred|tom|davis|eric|tony|matthew|andrew|roger/.test(name)) score += 18;
        if (/sonia|libby|serena|samantha|kate|aria|jenny/.test(name)) score += 5;
        if (/compact|espeak|robot/.test(name)) score -= 60;
        return score;
      }
      function refreshVoices() {
        const selected = voicePicker.value;
        const hasRecording = Object.keys(recordingClips).length > 0;
        availableVoices = ('speechSynthesis' in window
            ? window.speechSynthesis.getVoices().filter(v => /^en\b|^en-/i.test(v.lang))
            : [])
          .sort((a,b) => voiceQuality(b)-voiceQuality(a)).slice(0,18);
        voicePicker.replaceChildren(new Option(hasRecording ? 'Recorded' : 'Bunny picks', ''));
        availableVoices.forEach(v => voicePicker.append(new Option(v.name+' · '+v.lang,v.voiceURI)));
        voicePicker.value = availableVoices.some(v => v.voiceURI === selected) ? selected : '';
        voicePicker.hidden = availableVoices.length < 2 && !hasRecording;
      }
      refreshVoices();
      if ('speechSynthesis' in window) window.speechSynthesis.addEventListener?.('voiceschanged',refreshVoices);
      const sceneTrackKey = () => step === 'detail' ? 'detail-'+picks.activityKey : step;
      voicePicker.addEventListener('change', () => {
        if (unlocked) say(screens[step].speech,sceneTrackKey());
      });
      function setTalking(isTalking) {
        bunny.classList.toggle('talking',isTalking);
        if (!isTalking) bunny.removeAttribute('data-lip');
      }
      function stopVoice() {
        ++voiceSession;
        if (bunnyVideo) {
          bunnyVideo.onended = null;
          bunnyVideo.onerror = null;
          bunnyVideo.onplaying = null;
          bunnyVideo.pause();
          activeVideo=false;
          startIdleVideo();
        }
        if (currentRecording) {
          currentRecording.pause();
          currentRecording.removeAttribute('src');
          currentRecording = null;
        }
        if (lipSyncTimer) { clearInterval(lipSyncTimer); lipSyncTimer = null; }
        speechUtterance = null;
        setTalking(false);
        try { window.speechSynthesis?.cancel(); } catch (_) { /* Older mobile browsers. */ }
      }
      function speakWithDevice(text,token,onComplete) {
        if (token !== voiceSession || !voiceOn || !('speechSynthesis' in window) ||
            !('SpeechSynthesisUtterance' in window)) return;
        const spoken = text.replace(/[♡✉🐰🌷🎉]/gu,'').replace(/\s+/g,' ').trim();
        const msg = new SpeechSynthesisUtterance(spoken);
        speechUtterance = msg; // Retain until utterance completes (iOS/Safari).
        const selected = availableVoices.find(v => v.voiceURI === voicePicker.value);
        const voice = selected || availableVoices[0] ||
          window.speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
        if (voice) msg.voice = voice;
        msg.lang = voice?.lang || 'en-US';
        msg.rate = 1.02;
        msg.pitch = 1.06;
        msg.volume = .95;
        msg.onstart = () => { if(token === voiceSession) setTalking(true); };
        // Where supported, move the mouth at actual spoken-word boundaries.
        msg.onboundary = (event) => {
          if(token !== voiceSession || !bunny.classList.contains('talking')) return;
          if(event.name && event.name !== 'word') return;
          const word = spoken.slice(event.charIndex, event.charIndex + (event.charLength || 5)).toLowerCase();
          const open = /[aeiou]/.test(word) ? 2 : /[pbm]/.test(word) ? 3 : 1;
          bunny.dataset.lip = String(open);
        };
        const finish = () => {
          if(token !== voiceSession) return;
          setTalking(false);
          speechUtterance = null;
          if (typeof onComplete === 'function') onComplete();
        };
        msg.onend = finish;
        msg.onerror = finish;
        try { window.speechSynthesis.speak(msg); } catch (_) { finish(); }
      }
      function playBunnyFilm(path,text,token,onComplete,clipKey) {
        if(!bunnyVideo) return false;
        activeVideo=true;
        bunnyVideo.pause();
        bunnyVideo.loop=false;
        bunnyVideo.muted=false;
        bunnyVideo.src=path;
        bunnyVideo.load();
        let settled=false;
        const fallback=()=>{
          if(settled || token!==voiceSession || !activeVideo)return;
          settled=true;
          bunnyVideo.pause();activeVideo=false;
          startIdleVideo();setTalking(false);
          const clip=recordingClips[clipKey];
          if(clip) playRecordedClip(clip,text,token,onComplete);
          else speakWithDevice(text,token,onComplete);
        };
        bunnyVideo.onplaying=()=>{ if(token===voiceSession)setTalking(true); };
        bunnyVideo.onended=()=>{
          if(token!==voiceSession || settled)return;
          settled=true;activeVideo=false;
          setTalking(false);startIdleVideo();
          if(typeof onComplete==='function')onComplete();
        };
        bunnyVideo.onerror=fallback;
        try {
          const promise=bunnyVideo.play();
          if(promise && typeof promise.catch==='function')promise.catch(fallback);
        }catch(_){fallback();}
        return true;
      }
      function playRecordedClip(path,text,token,onComplete) {
        const audio = new Audio(path);
        currentRecording = audio;
        audio.preload = 'auto';
        audio.volume = 1;
        function fallBack() {
          if (token !== voiceSession || currentRecording !== audio) return;
          audio.pause();
          currentRecording = null;
          if (lipSyncTimer) { clearInterval(lipSyncTimer); lipSyncTimer=null; }
          setTalking(false);
          speakWithDevice(text,token,onComplete);
        }
        audio.addEventListener('playing', () => {
          if (token !== voiceSession) return;
          setTalking(true);
          // Rhythmic lip-sync proxy; accurate phonemes can be added with TTS timestamps.
          lipSyncTimer = window.setInterval(() => {
            if (token !== voiceSession || audio.paused) return;
            bunny.dataset.lip = String(Math.floor(audio.currentTime*13) % 4);
          }, 65);
        },{once:true});
        audio.addEventListener('ended',() => {
          if (token !== voiceSession) return;
          currentRecording=null;
          if(lipSyncTimer) {clearInterval(lipSyncTimer);lipSyncTimer=null;}
          setTalking(false);
          if (typeof onComplete === 'function') onComplete();
        },{once:true});
        audio.addEventListener('error',fallBack,{once:true});
        audio.play().catch(fallBack);
      }
      function performBunnyFlourish() {
        if(reduceMotion) return;
        bunny.classList.remove('cartoon-flourish');
        void bunny.offsetWidth;
        bunny.classList.add('cartoon-flourish');
      }
      bunny.addEventListener('click', () => {
        if(!unlocked) return;
        performBunnyFlourish();
        say('I have a top-secret announcement. Carrots are vegetables. And I am, frankly, adorable. Please keep this confidential.', 'secret');
      });
      bunny.addEventListener('keydown', (event) => {
        if(event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        bunny.click();
      });
      function say(text,clipKey=sceneTrackKey(),onComplete) {
        stopVoice();
        if (!voiceOn) return false;
        const token=voiceSession;
        const sceneCanUseRecording=clipKey && !editedVoiceClips.has(clipKey);

      function dodge(no) {
        if (tries >= 3 || reduceMotion) return false;

        const count = ++tries;
        const arena = no.closest('.ask-buttons');

        const travelY = Math.max(0, (arena.clientHeight - no.offsetHeight) / 2 - 10);
        // Three long hops: upper-left, lower-middle, lower-left.
        const poses = [
          {x:-travelX*.97, y:-travelY*.94, turn:19, face:'😛'},
          {x:-travelX*.48, y:travelY*.96, turn:-19, face:'🤪'},
          {x:-travelX*.96, y:travelY*.92, turn:14, face:'😜'}
        ];
        const pose = poses[count - 1];
        no.style.setProperty('--dx', Math.round(pose.x) + 'px');
        no.style.setProperty('--dy', Math.round(pose.y) + 'px');
        no.style.setProperty('--twist', pose.turn + 'deg');
        no.classList.add('mischief');
        const face = no.querySelector('.face');
        if (face) face.textContent = pose.face;
        bunny.dataset.mood = 'blep';
        // The No joke has no extra text, only expressions and movement.
        clearTimeout(escapeTimer);
        escapeTimer = window.setTimeout(() => {
          no.style.setProperty('--dx','0px');
          no.style.setProperty('--dy','0px');
          no.style.setProperty('--twist','0deg');
          no.classList.remove('mischief');
          if (count === 3) {
            no.classList.add('gave-up');
            if (face) face.textContent = '😌';
          }
          bunny.dataset.mood = 'wink';
        }, 840);
        return true;
      }

          flows.splice(flows.indexOf('success'),0,key);
        }
        if(unlocked){screens.ask.heading=fillQuestion(configuredAskTemplate);render();}
      }
      const configReady = fetch('/.netlify/functions/public-config',{cache:'no-store'})
        .then(res=>res.ok?res.json():{})
        .then(data=>{if(data?.ok)applyOwnerSettings(data.settings);})
        .catch(()=>{/* Leave the original invitation available if settings are offline. */});
      back.addEventListener('click', () => {
        const ix=step.startsWith('extra-')?Number(step.slice(6)):-1;
        const previous = ix>=0?(ix===0?'schedule':'extra-'+(ix-1)):{ ask: 'intro', outing: 'ask', detail: 'outing', area: 'detail', schedule: 'area' }[step];
        if (previous) nav(previous);
      });
      render();
    })();
  </script>
</body>
</html>
